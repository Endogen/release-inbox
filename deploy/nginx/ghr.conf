# nginx site for the release inbox. Replace releases.example.com with your domain.
# Certificates: sudo certbot certonly --nginx -d releases.example.com

# Slow down password guessing: 5 login attempts per minute and client address.
limit_req_zone $binary_remote_addr zone=ghr_login:10m rate=5r/m;

upstream ghr_backend {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name releases.example.com;
    return 301 https://$host$request_uri;
}

server {
    # Ubuntu 24.04 ships nginx 1.24, which enables HTTP/2 on the listen directive.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name releases.example.com;

    ssl_certificate /etc/letsencrypt/live/releases.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/releases.example.com/privkey.pem;

    root /opt/ghr/frontend/dist;
    include /etc/nginx/snippets/ghr-security-headers.conf;

    location = /api/auth/login {
        limit_req zone=ghr_login burst=5 nodelay;
        include /etc/nginx/snippets/ghr-proxy.conf;
    }

    # Server-sent events: keep the connection open and stream without buffering.
    location = /api/events {
        include /etc/nginx/snippets/ghr-proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Summaries wait for Claude, which can take longer than the default minute.
    location = /api/summaries {
        include /etc/nginx/snippets/ghr-proxy.conf;
        proxy_read_timeout 5m;
    }

    location /api/ {
        include /etc/nginx/snippets/ghr-proxy.conf;
    }

    # Hashed build assets never change.
    location /assets/ {
        include /etc/nginx/snippets/ghr-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker must be revalidated so updates reach browsers quickly.
    location = /sw.js {
        include /etc/nginx/snippets/ghr-security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Single-page app: unknown paths are handled by the client-side router.
    location / {
        include /etc/nginx/snippets/ghr-security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
