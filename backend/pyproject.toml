[project]
name = "ghr"
version = "0.5.1"
description = "Self-hosted inbox for GitHub release notifications"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14",
    # Not imported directly: SQLAlchemy loads it for "sqlite+aiosqlite://" URLs.
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "anthropic>=1.11",
    "cryptography>=50.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    # Not imported directly: Starlette's SessionMiddleware signs the cookie with it.
    "itsdangerous>=2.2.0",
    "pwdlib[argon2]>=0.3.1",
    "py-vapid>=1.9",
    "pydantic>=2.13",
    "pydantic-settings>=2.15.0",
    "pywebpush>=2.5.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "starlette>=1.7",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.54.0",
]

[tool.deptry.per_rule_ignores]
DEP002 = ["aiosqlite", "itsdangerous"]

[project.scripts]
ghr = "ghr.cli:cli"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF", "N", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
# Literal status codes and counts keep assertions readable.
"tests/**" = ["PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["ghr"]

[tool.pyright]
include = ["src", "tests"]
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
