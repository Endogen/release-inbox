name: Website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/website.yml
  # Rebuild after release installers are uploaded, from the default branch allowed
  # by the github-pages environment (a release event runs on its tag instead).
  workflow_run:
    workflows: [Desktop]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer one waits instead of cancelling a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'release' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # The site lives under /<repository>/ on GitHub Pages.
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Reads the newest release and star count without hitting the anonymous rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_TELEMETRY_DISABLED: 1
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
