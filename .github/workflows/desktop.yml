name: Desktop

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - desktop/**
      - .github/workflows/desktop.yml

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the AppImage runs on older distributions too.
          - os: ubuntu-22.04
          - os: windows-latest
          # One app for Apple silicon and Intel Macs.
          - os: macos-latest
            targets: aarch64-apple-darwin, x86_64-apple-darwin
            build-args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - name: Install the system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - run: cargo fmt --check
        working-directory: desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: desktop/src-tauri
      - run: cargo test
        working-directory: desktop/src-tauri
      # Installers only for main: pull requests stop at the checks above.
      - if: github.event_name == 'push'
        run: npm run build -- ${{ matrix.build-args }}
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: releases-desktop-${{ runner.os }}
          path: |
            desktop/src-tauri/target/**/release/bundle/*/*.msi
            desktop/src-tauri/target/**/release/bundle/*/*.exe
            desktop/src-tauri/target/**/release/bundle/*/*.dmg
            desktop/src-tauri/target/**/release/bundle/*/*.AppImage
            desktop/src-tauri/target/**/release/bundle/*/*.deb
            desktop/src-tauri/target/**/release/bundle/*/*.rpm
          if-no-files-found: error
