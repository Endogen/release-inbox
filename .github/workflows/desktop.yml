name: Desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - desktop/**
      - .github/workflows/desktop.yml

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Ubuntu, so the AppImage runs on older distributions too.
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - name: Install the system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - run: cargo fmt --check
        working-directory: desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: desktop/src-tauri
      - run: cargo test
        working-directory: desktop/src-tauri
      - run: npx tauri build
      - uses: actions/upload-artifact@v6
        with:
          name: releases-desktop-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/*/*.msi
            desktop/src-tauri/target/release/bundle/*/*.exe
            desktop/src-tauri/target/release/bundle/*/*.dmg
            desktop/src-tauri/target/release/bundle/*/*.AppImage
            desktop/src-tauri/target/release/bundle/*/*.deb
            desktop/src-tauri/target/release/bundle/*/*.rpm
          if-no-files-found: error
